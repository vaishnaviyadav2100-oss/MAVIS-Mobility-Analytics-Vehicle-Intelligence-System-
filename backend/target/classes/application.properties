# MAVIS Server Configuration
server.port=8080

# Application Name
spring.application.name=mavis-backend

# MySQL Database Configuration
# (Make sure MySQL is running on port 3306. It will automatically create mavis_db if it does not exist)
spring.datasource.url=jdbc:mysql://localhost:3306/mavis_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (HMAC-SHA256 256-bit Hex Key)
mavis.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
mavis.jwt.expiration=86400000

# CORS Allowed Origins
mavis.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Razorpay Test Mode Configuration
razorpay.key.id=rzp_test_mavis_demo
razorpay.key.secret=test_secret_mavis_demo_2026

# Database initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
